# Production config variant for the DETERMINISTIC I-JEPA baseline
# (main_det.py / src/train_det.py), for GPUs where the default
# configs/configs_det.yaml (batch_size 64) does not fit in memory.
#
# Same effective optimizer batch as the default variant:
#   batch_size 64  x backward_per_step 32  =  2048 images / optimizer step
#   batch_size 32  x backward_per_step 64  =  2048 images / optimizer step
# (gradient accumulation only saves the activations of one forward at a
#  time, so per-iteration activation memory is halved while training stays
#  equivalent: same number of images per optimizer step, same lr schedule
#  length logic via ipe = len(loader) // backward_per_step).
#
# logging.folder / write_tag are IDENTICAL to configs_det.yaml on purpose:
# the two variants are the same experiment at different forward memory, so
# the DET checkpoint/logs always land in one place (run one variant per
# training run; whichever config was actually used is recorded in
# params-ijepa.yaml inside the folder).
#
# Select with:  bash revision/run.sh bs32   (= CONFIG=configs/configs_det_bs32.yaml)
data:
  batch_size: 32
  backward_per_step: 64.0
  color_jitter_strength: 0.0
  crop_scale:
  - 0.3
  - 1.0
  crop_size: 224
  image_folder: imagenet-100/
  num_workers: 10
  pin_mem: true
  root_path: /home/jonoki/research
  use_color_distortion: false
  use_gaussian_blur: false
  use_horizontal_flip: false
logging:
  folder: results/vitb16.224-bs.2048-ep.300-det/
  write_tag: jepa-det
mask:
  allow_overlap: false
  aspect_ratio:
  - 0.75
  - 1.5
  enc_mask_scale:
  - 0.85
  - 1.0
  min_keep: 10
  num_enc_masks: 1
  num_pred_masks: 4
  patch_size: 16
  pred_mask_scale:
  - 0.15
  - 0.2
meta:
  copy_data: false
  load_checkpoint: False
  model_name: vit_base
  pred_depth: 6
  pred_emb_dim: 384
  predictor_dropout: 0.1
  sigma_depth: 6
  read_checkpoint: null
  use_bfloat16: true
optimization:
  ema:
  - 0.996
  - 1.0
  epochs: 600
  final_lr: 1.0e-06
  final_weight_decay: 0.4
  ipe_scale: 1.0
  lr: 0.001
  start_lr: 0.0002
  warmup: 40
  weight_decay: 0.04
